# Production-only example values for the parent chart
# Purpose: canonical, presence-based example showing namespace-scoped observability
# Assumptions:
# - Collector is the local otel-collector subchart and reads these keys
# - Some component charts may not support namespace-scoped RBAC via values; see TODO comments

collector:
  # ServiceAccount & RBAC intent for the collector (generate namespaced Role)
  serviceAccount:
    create: true
  rbac:
    scope: namespaced # intent: generate a Role (not ClusterRole)

  # Prometheus receiver scrape target blocks (presence-based)
  receivers:
    prometheus:
      node_exporter:
        namespace: production
        service: prometheus-node-exporter
        port: 9100
      kube_state_metrics:
        namespace: production
        service: kube-state-metrics
        port: 8080
      kepler:
        namespace: production
        service: kepler
        port: 9102

# Dependency value overrides for external charts (pass-through to child charts)
# NOTE: if the upstream chart does not support namespace-scoped RBAC via values,
# document this as a TODO and require a manual patch after install.
prometheus-node-exporter:
  serviceAccount:
    create: true
  # no namespace-scoped node access by default; node-exporter runs as DaemonSet

kube-state-metrics:
  rbac:
    create: true
  # If the upstream chart supports restricting KSM to namespaces, use the key below.
  # If not supported, this is a documented assumption for manual follow-up.
  kubeStateMetrics:
    namespaces:
      - production
  # TODO: If the kube-state-metrics chart (v7.3.0) does not admit `kubeStateMetrics.namespaces`,
  # the user must manually restrict its Role/RoleBinding after installation.

kepler:
  serviceAccount:
    create: true
  # Kepler is typically cluster-wide. If you need to restrict its scope, update upstream chart values.
