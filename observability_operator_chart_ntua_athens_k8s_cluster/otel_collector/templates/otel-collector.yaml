apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.otelCollector.configMapName }}
  labels:
    app: {{ .Values.otelCollector.deploymentName }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
  annotations:
    "helm.sh/resource-policy": keep

data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    processors:
      batch: {}
      resource:
        attributes:
          - key: cluster
            value: {{ .Values.otelCollector.clusterName }}
            action: insert
    exporters:
      otlp:
        endpoint: {{ .Values.otelCollector.exporters.otlp.host }}:{{ .Values.otelCollector.exporters.otlp.port }}
        tls:
          insecure: {{ .Values.otelCollector.tls.insecure }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          global:
            scrape_interval: {{ .Values.otelCollector.scrapeInterval }}
            evaluation_interval: {{ .Values.otelCollector.evaluationInterval }}
          scrape_configs:
            - job_name: "cadvisor"
              scheme: "https"
              tls_config:
                ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              bearer_token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              kubernetes_sd_configs:
                - role: "node"
              relabel_configs:
                - target_label: "__address__"
                  replacement: "kubernetes.default.svc:443"
                  action: "replace"
                - source_labels: [__meta_kubernetes_node_name]
                  regex: "(.+)"
                  target_label: "__metrics_path__"
                  replacement: "/api/v1/nodes/$${1}/proxy/metrics/cadvisor"
                  action: "replace"
            - job_name: "network-latency-agent"
              kubernetes_sd_configs:
                - role: "service"
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  regex: network-latency-agent-service
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.otelCollector.deploymentName }}
  labels:
    app: {{ .Values.otelCollector.deploymentName }}
spec:
  replicas: {{ .Values.otelCollector.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.otelCollector.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.otelCollector.deploymentName }}
    spec:
      serviceAccountName: otel-collector-serviceaccount
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image.registry }}/{{ .Values.otelCollector.image.name }}:{{ .Values.otelCollector.image.tag }}"
          args: ["--config=/conf/collector.yaml"]
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: {{ .Values.otelCollector.configMapName }}