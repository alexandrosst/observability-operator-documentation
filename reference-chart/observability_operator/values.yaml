network-latency:
  target_hosts:
    - cluster: "localhost"
      host_ip: ["127.0.0.1"]
    - cluster: "custom_cluster"
      host_ip: ["192.168.1.100"]

prometheus-node-exporter:
  fullnameOverride: node-exporter

kube-state-metrics:
  fullnameOverride: kube-state-metrics

kepler:
  fullnameOverride: kepler

fluent-bit:
  fullnameOverride: fluent-bit
  extraVolumes:
    - name: systemd-journal
      hostPath:
        path: /run/systemd/journal

  extraVolumeMounts:
    - name: systemd-journal
      mountPath: /run/systemd/journal
      readOnly: true

  config:
    inputs: |
      # Pod logs
      # [INPUT]
          # Name              tail
          # Tag               kube.*
          # Path              /var/log/containers/*.log
          # multiline.parser  docker, cri
          # Mem_Buf_Limit     5MB
          # Skip_Long_Lines   On

      # k3s logs (includes kubelet, apiserver, scheduler, controller-manager)
      [INPUT]
          Name           tail
          Tag            k3s.*
          Path           /var/log/k3s.log

      # System logs (syslog)
      [INPUT]
          Name           tail
          Tag            syslog.*
          Path           /var/log/syslog

      # containerd logs from journald
      [INPUT]
          Name           systemd
          Tag            node.system.*
          Path           /run/systemd/journal
          Systemd_Filter _SYSTEMD_UNIT=containerd

    filters: |
      [FILTER]
          Name          modify
          Match         k3s.*
          Add           log_source k3s
          Add           service_name k3s-cluster

      [FILTER]
          Name          modify
          Match         syslog.*
          Add           log_source syslog
          Add           service_name os-systemd

      [FILTER]
          Name          modify
          Match         node.system.*
          Add           log_source containerd
          Add           service_name container-runtime

    outputs: |
      [OUTPUT]
          Name            opentelemetry
          Match           *
          Host            otel-agent-service
          Port            4318
          Metrics_URI     /v1/metrics
          Logs_URI        /v1/logs
          Traces_URI      /v1/traces
          Log_response_payload False
          Tls             Off
          Logs_body_key   log
          Logs_body_key_attributes true
          Logs_attributes_metadata_key attributes
          Logs_resource_metadata_key resource
          Logs_instrumentation_scope_metadata_key scope

      [OUTPUT]
          Name            stdout
          Match           *
          Format          json_lines