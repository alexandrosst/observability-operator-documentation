apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.otelCollector.configMapName }}
data:
  otel-agent-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          global:
            scrape_interval: 5s
            evaluation_interval: 5s
          scrape_configs:
            - job_name: "kepler"
              kubernetes_sd_configs:
                - role: "pod"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: "kepler"
                  action: "keep"
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
            - job_name: "node-exporter"
              kubernetes_sd_configs:
                - role: "pod"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: "prometheus-node-exporter"
                  action: "keep"
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
            - job_name: "cadvisor"
              scheme: "https"
              tls_config:
                ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              bearer_token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              kubernetes_sd_configs:
                - role: "node"
              relabel_configs:
                - target_label: "__address__"
                  replacement: "kubernetes.default.svc:443"
                  action: "replace"
                - source_labels: [__meta_kubernetes_node_name]
                  regex: "(.+)"
                  target_label: "__metrics_path__"
                  replacement: "/api/v1/nodes/$${1}/proxy/metrics/cadvisor"
                  action: "replace"
            - job_name: "kubelet"
              scheme: "https"
              tls_config:
                ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              bearer_token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              kubernetes_sd_configs:
                - role: "node"
              relabel_configs:
                - target_label: "__address__"
                  replacement: "kubernetes.default.svc:443"
                  action: "replace"
                - source_labels: [__meta_kubernetes_node_name]
                  regex: "(.+)"
                  target_label: "__metrics_path__"
                  replacement: "/api/v1/nodes/$${1}/proxy/metrics"
                  action: "replace"
            - job_name: "kube-state-metrics"
              kubernetes_sd_configs:
                - role: "endpoints"
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  regex: kube-state-metrics
            - job_name: "network-latency-agent"
              kubernetes_sd_configs:
                - role: "service"
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  regex: network-metrics-exporter-service
    exporters:
      debug:
        verbosity: detailed
      otlp:
        endpoint: {{ .Values.otelCollector.exporters.otlp.host }}:{{ .Values.otelCollector.exporters.otlp.port }}
        tls:
          insecure: {{ .Values.otelCollector.exporters.tls.insecure }}
    processors:
      batch:
      resource:
        attributes:
          - key: cluster
            value: {{ .Values.otelCollector.clusterName }}
            action: insert
    service:
      extensions:
      - health_check
      pipelines:
        {{- range $pipeline, $details := .Values.otelCollector.pipelines }}
        {{ $pipeline }}:
          receivers:
            {{- range $details.receivers }}
            - {{ . }}
            {{- end }}
          exporters:
            {{- range $details.exporters }}
            - {{ . }}
            {{- end }}
          processors:
            {{- range $details.processors }}
            - {{ . }}
            {{- end }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.otelCollector.deploymentName }}
spec:
  replicas: {{ .Values.otelCollector.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.otelCollector.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.otelCollector.deploymentName }}
    spec:
      serviceAccountName: otel-collector-serviceaccount
      containers:
        - name: {{ .Values.otelCollector.deploymentName }}
          image: "{{ .Values.otelCollector.image.registry }}/{{ .Values.otelCollector.image.name }}:{{ .Values.otelCollector.image.tag }}"
          imagePullPolicy: Always
          args: ["--config=/conf/otel-agent-config.yaml"]
          volumeMounts:
            - name: config-volume
              mountPath: /conf
          readinessProbe:
            httpGet:
              path: /
              port: 13133
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 2
      volumes:
      - name: config-volume
        configMap:
          name: {{ .Values.otelCollector.configMapName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.otelCollector.serviceName }}
spec:
  selector:
    app: {{ .Values.otelCollector.deploymentName }}
  ports:
    {{- range $port, $details := .Values.otelCollector.ports }}
    - name: {{ $port }}
      protocol: TCP
      port: {{ $details.port }}
      targetPort: {{ $details.targetPort }}
    {{- end }}