network-latency:
  name: network-latency-agent   # determines the Kubernetes Service name: <name>-service
  target_hosts:
    - cluster: "datacenter-south-02"
      host_ip: ["192.168.1.10", "192.168.1.25", "172.16.0.5", "172.16.0.18"]
  parameters:
    interval: 10                 # scrape interval in seconds (integer, no 's' suffix)

