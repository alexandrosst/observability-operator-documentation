apiVersion: v1
kind: ConfigMap
metadata:
  name: "otel-collector-config"
data:
  "otel-agent-config.yaml": |
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: 30s
            evaluation_interval: 30s
          scrape_configs:
            - job_name: "node-exporter"
              kubernetes_sd_configs:
                - role: "pod"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: "prometheus-node-exporter"
                  action: "keep"
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
    processors:
      batch:
      resource:
        attributes:
          - key: "cluster"
            value: "cloud-prod-eu-1"
            action: "insert"
    exporters:
      otlp:
        endpoint: "otel-gateway.monitoring.svc.cluster.local:4318"
        tls:
          insecure: true
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [resource, batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "otel-collector"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "otel-collector"
  template:
    metadata:
      labels:
        app: "otel-collector"
      annotations:
        checksum/config: ""
    spec:
      containers:
        - name: "otel-collector"
          image: "otel/opentelemetry-collector-contrib:0.98.0"
          args: ["--config=/conf/otel-agent-config.yaml"]
          volumeMounts:
            - name: "config-volume"
              mountPath: "/conf"
          readinessProbe:
            httpGet:
              path: "/"
              port: 13133
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 2
      volumes:
        - name: "config-volume"
          configMap:
            name: "otel-collector-config"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.otelCollector.serviceName }}
spec:
  selector:
    app: "otel-collector"
  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318
