otel-collector:
  otelCollector:
    clusterName: "athens_k8s_cluster"
    scrapeInterval: 5s
    evaluationInterval: 5s
    deploymentName: otel-collector
    configMapName: otel-collector-config
    configChecksum: ""
    serviceName: otel-collector
    replicas: 1
    image:
      registry: otel
      name: opentelemetry-collector-contrib
      tag: "0.98.0"
    exporters:
      otlp:
        host: "147.102.13.108"
        port: 4318
        tls:
          insecure: true

kepler:
  fullnameOverride: kepler

network-latency:
  fullnameOverride: network-latency-agent
  name: network-latency-agent
  target_hosts:
    - cluster: "testbed_cluster"
      host_ip: ["147.102.13.200", "127.0.0.1"]
