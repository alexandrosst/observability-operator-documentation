prometheus-node-exporter:
  fullnameOverride: node-exporter

otelCollector:
  clusterName: athens_k8s_cluster
  scrapeInterval: 8s
  evaluationInterval: 5s
  configMapName: otel-collector-config-map
  deploymentName: otel-collector
  serviceName: otel-collector-service
  image:
    registry: otel
    name: opentelemetry-collector-contrib
    tag: "0.98.0"
  replicas: 1
  exporters:
    otlp:
      host: 147.102.13.108
      port: 4318
      tls:
        insecure: true
  ports:
    otlp-grpc:
      port: 4317
      targetPort: 4317
    otlp-http:
      port: 4318
      targetPort: 4318
  pipelines:
    metrics:
      receivers: ["prometheus", "otlp"]
      exporters: ["otlp"]
      processors: ["resource", "batch"]
    logs:
      receivers: ["otlp"]
      exporters: ["otlp"]
      processors: ["resource", "batch"]