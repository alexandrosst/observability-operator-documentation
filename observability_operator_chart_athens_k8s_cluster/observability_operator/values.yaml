otel-collector:
  otelCollector:
    clusterName: athens_k8s_cluster
    scrapeInterval: 15s
    evaluationInterval: 15s
    exporters:
      otlp:
        host: otel-gateway-service.default.svc
        port: 4318
        tls:
          insecure: true
  prometheusJobs:
    - job_name: kepler
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex: "kepler"
          action: keep
        - source_labels: ["__meta_kubernetes_pod_node_name"]
          target_label: node
kepler:
  fullnameOverride: kepler
