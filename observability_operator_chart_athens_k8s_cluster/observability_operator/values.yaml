otelCollector:
  clusterName: athens_k8s_cluster
  scrapeInterval: 8s
  evaluationInterval: 5s
  exporters:
    otlp:
      host: 147.102.13.108
      port: 4318
      tls:
        insecure: true
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resource, batch]
      exporters: [otlp]
kepler:
  fullnameOverride: kepler
prometheus-node-exporter:
  fullnameOverride: node-exporter
