otelCollector:
  clusterName: athens_k8s_cluster
  deploymentName: otel-collector
  replicas: 1
  configMapName: otel-collector-config-map
  serviceName: otel-collector-service
  image:
    registry: otel
    name: opentelemetry-collector-contrib
    tag: latest
  scrapeInterval: 5s
  evaluationInterval: 5s
  exporters:
    otlp:
      host: 147.102.13.108
      port: 4318
      tls:
        insecure: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      global:
        scrape_interval: 5s
        evaluation_interval: 5s
      scrape_configs:
        - job_name: kepler
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              regex: "kepler"
              action: keep
            - source_labels: [__meta_kubernetes_pod_node_name]
              target_label: node
        - job_name: node-exporter
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              regex: "prometheus-node-exporter"
              action: keep
            - source_labels: [__meta_kubernetes_pod_node_name]
              target_label: node

processors:
  batch: {}
  resource:
    attributes:
      - key: cluster
        value: athens_k8s_cluster
        action: insert

exporters:
  otlp:
    endpoint: "147.102.13.108:4318"
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [resource, batch]
      exporters: [otlp]
