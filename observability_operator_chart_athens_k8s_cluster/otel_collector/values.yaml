otelCollector:
  configMapName: otel-collector-config
  deploymentName: otel-collector
  serviceName: otel-collector-svc
  replicas: 1
  image:
    registry: otelcol
    name: otel-collector
    tag: latest
  ports:
    otlp-grpc:
      port: 4317
      targetPort: 4317
    otlp-http:
      port: 4318
      targetPort: 4318
    health-check:
      port: 13133
      targetPort: 13133
