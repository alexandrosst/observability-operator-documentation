otelCollector:
  configMapName: otel-agent-config
  deploymentName: otel-collector
  serviceName: otel-collector
  replicas: 1
  image:
    registry: otel/opentelemetry-collector-contrib
    name: otel-collector-contrib
    tag: 0.103.0
  ports: {}
  pipelines:
    metrics:
      receivers:
        - prometheus
      processors:
        - resource
        - batch
      exporters:
        - otlp
  scrapeInterval: 8s
  evaluationInterval: 5s
