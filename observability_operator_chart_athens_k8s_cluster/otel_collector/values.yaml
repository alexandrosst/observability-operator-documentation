otelCollector:
  clusterName: athens_k8s_cluster
  deploymentName: otel-collector
  serviceName: otel-collector-service
  configMapName: otel-collector-config-map
  replicas: 1
  image:
    registry: otel
    name: opentelemetry-collector
    tag: latest
  scrapeInterval: 8s
  evaluationInterval: 8s
  exporters:
    otlp:
      host: 147.102.13.108
      port: 4318
    tls:
      insecure: true
  scrapeJobs:
    - job_name: kepler
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: "kepler"
          action: keep
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
