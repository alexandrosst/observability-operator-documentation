otelCollector:
  clusterName: athens_k8s_cluster
  deploymentName: otel-collector
  replicas: 1
  configMapName: otel-collector-config-map
  serviceName: otel-collector-service
  image:
    registry: otel
    name: opentelemetry-collector-contrib
    tag: latest
  scrapeInterval: 15s
  evaluationInterval: 5s
  exporters:
    otlp:
      host: otel-gateway-service.default.svc
      port: 4318
    tls:
      insecure: true
