apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.otelCollector.serviceName }}
  labels:
    app: {{ .Values.otelCollector.deploymentName }}
spec:
  selector:
    app: {{ .Values.otelCollector.deploymentName }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
