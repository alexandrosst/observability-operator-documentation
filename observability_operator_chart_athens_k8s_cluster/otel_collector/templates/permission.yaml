apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-collector.fullname" . }}-serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-collector.fullname" . }}-clusterrole
rules:
- apiGroups: [""]
  resources:
  - pods
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - events
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otel-collector.fullname" . }}-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otel-collector.fullname" . }}-clusterrole
subjects:
- kind: ServiceAccount
  name: {{ include "otel-collector.fullname" . }}-serviceaccount
  namespace: {{ .Release.Namespace }}
