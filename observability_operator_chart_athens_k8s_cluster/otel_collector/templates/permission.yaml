apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include \"otel-collector.serviceAccountName\" . }}
  labels:
    {{- include \"otel-collector.labels\" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include \"otel-collector.fullname\" . }}-clusterrole
  labels:
    {{- include \"otel-collector.labels\" . | nindent 4 }}
rules:
  - apiGroups: [\"\"]
    resources: [\"pods\", \"nodes\", \"services\", \"endpoints\", \"events\"]
    verbs: [\"get\", \"list\", \"watch\"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include \"otel-collector.fullname\" . }}-clusterrolebinding
  labels:
    {{- include \"otel-collector.labels\" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include \"otel-collector.serviceAccountName\" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include \"otel-collector.fullname\" . }}-clusterrole
  apiGroup: rbac.authorization.k8s.io
