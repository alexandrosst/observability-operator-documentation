{{- $collector := .Values.otelCollector -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $collector.configMapName }}
  labels:
    app: {{ $collector.deploymentName }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      k8s_events:
        auth_type: serviceAccount
        namespaces: []
      prometheus:
        config:
          global:
            scrape_interval: {{ $collector.scrapeInterval }}
            evaluation_interval: {{ $collector.evaluationInterval }}
          scrape_configs:
{{- range $job := $collector.prometheusJobs }}
            - job_name: {{ $job.job_name }}
{{ toYaml $job | indent 14 }}
{{- end }}
    processors:
      batch: {}
      resource:
        attributes:
          - key: cluster
            value: {{ $collector.clusterName }}
            action: insert
    exporters:
      otlp:
        endpoint: {{ $collector.exporters.otlp.host }}:{{ $collector.exporters.otlp.port }}
        tls:
          insecure: {{ $collector.exporters.otlp.tls.insecure }}
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch,resource]
          exporters: [otlp]
        logs:
          receivers: [otlp,k8s_events]
          processors: [batch,resource]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $collector.deploymentName }}
spec:
  replicas: {{ $collector.replicas }}
  selector:
    matchLabels:
      app: {{ $collector.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ $collector.deploymentName }}
    spec:
      serviceAccountName: otel-collector-serviceaccount
      containers:
        - name: otel-collector
          image: {{ $collector.image.registry }}/{{ $collector.image.name }}:{{ $collector.image.tag }}
          args: ["--config=/conf/collector.yaml"]
          volumeMounts:
            - name: collector-config
              mountPath: /conf
      volumes:
        - name: collector-config
          configMap:
            name: {{ $collector.configMapName }}