---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.otelCollector.configMapName }}
  labels:
    app: {{ .Release.Name }}
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: {{ .Values.otelCollector.scrapeInterval }}
            evaluation_interval: {{ .Values.otelCollector.evaluationInterval }}
          scrape_configs:
            - job_name: "kepler"
              kubernetes_sd_configs:
                - role: "pod"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: "kepler"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
            - job_name: "node-exporter"
              kubernetes_sd_configs:
                - role: "pod"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: "prometheus-node-exporter"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
            - job_name: "cadvisor"
              scheme: "https"
              tls_config:
                ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              bearer_token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - target_label: "__address__"
                  replacement: "kubernetes.default.svc:443"
                  action: replace
                - source_labels: [__meta_kubernetes_node_name]
                  regex: "(.+)"
                  target_label: "__metrics_path__"
                  replacement: "/api/v1/nodes/$${1}/proxy/metrics/cadvisor"
                  action: replace
            - job_name: "network-latency-agent"
              kubernetes_sd_configs:
                - role: service
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  regex: network-latency-agent-service
    processors:
      batch: {}
      resource:
        attributes:
          - key: cluster
            value: {{ .Values.otelCollector.clusterName }}
            action: insert
    exporters:
      otlp:
        endpoint: {{ .Values.otelCollector.exporters.otlp.host }}:{{ .Values.otelCollector.exporters.otlp.port }}
        tls:
          insecure: {{ .Values.otelCollector.exporters.otlp.tls.insecure }}
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [resource,batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.otelCollector.deploymentName }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.otelCollector.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: otel-collector-serviceaccount
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image.registry }}/{{ .Values.otelCollector.image.name }}:{{ .Values.otelCollector.image.tag }}"
          args: ["--config=/conf/otel-collector-config.yaml"]
          ports:
            - containerPort: {{ .Values.otelCollector.ports.otlpGrpc.port }}
              name: otlp-grpc
            - containerPort: {{ .Values.otelCollector.ports.otlpHttp.port }}
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: {{ .Values.otelCollector.configMapName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.otelCollector.serviceName }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      protocol: TCP
      port: {{ .Values.otelCollector.ports.otlpGrpc.port }}
      targetPort: {{ .Values.otelCollector.ports.otlpGrpc.targetPort }}
    - name: otlp-http
      protocol: TCP
      port: {{ .Values.otelCollector.ports.otlpHttp.port }}
      targetPort: {{ .Values.otelCollector.ports.otlpHttp.targetPort }}
    - name: health-check
      protocol: TCP
      port: {{ .Values.otelCollector.ports.healthCheck.port }}
      targetPort: {{ .Values.otelCollector.ports.healthCheck.targetPort }}
