{{- $collector := .Values.otelCollector }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $collector.configMapName }}
data:
  otel-collector-config.yaml: |
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: {{ $collector.scrapeInterval }}
            evaluation_interval: {{ $collector.evaluationInterval }}
          scrape_configs:
            - job_name: kepler
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: kepler
                  action: keep
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
            - job_name: node-exporter
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: prometheus-node-exporter
                  action: keep
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
    processors:
      batch: {}
      resource:
        attributes:
          - key: cluster
            value: {{ $collector.clusterName }}
            action: insert
    exporters:
      otlp:
        endpoint: "{{ $collector.exporters.otlp.host }}:{{ $collector.exporters.otlp.port }}"
        tls:
          insecure: {{ $collector.exporters.tls.insecure }}
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [resource,batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $collector.deploymentName }}
spec:
  replicas: {{ $collector.replicas }}
  selector:
    matchLabels:
      app: {{ $collector.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ $collector.deploymentName }}
    spec:
      serviceAccountName: otel-collector-serviceaccount
      containers:
        - name: otel-collector
          image: "{{ $collector.image.registry }}/{{ $collector.image.name }}:{{ $collector.image.tag }}"
          args: ["--config=/conf/otel-collector-config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: {{ $collector.configMapName }}
            items:
              - key: otel-collector-config.yaml
                path: otel-collector-config.yaml
