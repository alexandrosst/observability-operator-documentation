apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.otelCollector.configMapName }}
  labels:
    app: {{ .Release.Name }}
    chart: {{ .Chart.Name }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    processors:
      batch: {}
      resource:
        attributes:
          - key: cluster
            value: {{ .Values.otelCollector.clusterName }}
            action: insert
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      k8s_events:
        auth_type: serviceAccount
        namespaces: []
      prometheus:
        config:
          global:
            scrape_interval: {{ .Values.otelCollector.scrapeInterval }}
            evaluation_interval: {{ .Values.otelCollector.evaluationInterval }}
          scrape_configs:
            - job_name: "kepler"
              kubernetes_sd_configs:
                - role: "pod"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: "kepler"
                  action: "keep"
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
    exporters:
      otlp:
        endpoint: {{ .Values.otelCollector.exporters.otlp.host }}:{{ .Values.otelCollector.exporters.otlp.port }}
        tls:
          insecure: {{ .Values.otelCollector.exporters.otlp.tls.insecure | default true }}
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [resource,batch]
          exporters: [otlp]
        logs:
          receivers: [otlp,k8s_events]
          processors: [resource,batch]
          exporters: [otlp]
