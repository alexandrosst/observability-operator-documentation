{{- $collector := .Values.otelCollector -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $collector.configMapName }}
  labels:
    app: {{ $collector.deploymentName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-5"

data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: {{ $collector.scrapeInterval }}
            evaluation_interval: {{ $collector.evaluationInterval }}
          scrape_configs:
{{- range $job := $collector.prometheusJobs }}
            - job_name: "{{ $job.job_name }}"
              kubernetes_sd_configs:
                - role: "{{ $job.kubernetes_sd_configs[0].role }}"
              relabel_configs:
{{- range $rc := $job.relabel_configs }}
                - source_labels: [{{ (index $rc "source_labels") | join ", " }}]
{{- if $rc.regex }}                  regex: "{{ $rc.regex }}"{{ end }}
{{- if $rc.action }}                  action: "{{ $rc.action }}"{{ end }}
{{- if $rc.target_label }}                  target_label: "{{ $rc.target_label }}"{{ end }}
{{- end }}
{{- end }}
    processors:
      batch: {}
      resource:
        attributes:
          - key: cluster
            value: {{ $collector.clusterName }}
            action: insert
    exporters:
      otlp:
        endpoint: {{ $collector.exporters.otlp.host }}:{{ $collector.exporters.otlp.port }}
        tls:
          insecure: {{ $collector.exporters.otlp.tls.insecure }}
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [resource,batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $collector.deploymentName }}
  labels:
    app: {{ $collector.deploymentName }}
spec:
  replicas: {{ $collector.replicas }}
  selector:
    matchLabels:
      app: {{ $collector.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ $collector.deploymentName }}
    spec:
      serviceAccountName: otel-collector-serviceaccount
      containers:
        - name: otel-collector
          image: {{ $collector.image.registry }}/{{ $collector.image.name }}:{{ $collector.image.tag }}
          args: ["--config=/conf/otel-collector-config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: {{ $collector.configMapName }}
