apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.otelCollector.configMapName }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-otel-collector
  
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: {{ .Values.global.otelCollector.scrapeInterval }}
            evaluation_interval: {{ .Values.global.otelCollector.evaluationInterval }}
          scrape_configs:
            - job_name: "kepler"
              kubernetes_sd_configs:
                - role: "pod"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: "kepler"
                  action: "keep"
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
    processors:
      batch: {}
      resource:
        attributes:
          - key: cluster
            value: {{ .Values.global.otelCollector.clusterName }}
            action: insert
    exporters:
      otlp:
        endpoint: {{ .Values.global.otelCollector.exporters.otlp.host }}:{{ .Values.global.otelCollector.exporters.otlp.port }}
        tls:
          insecure: {{ .Values.global.otelCollector.tls.insecure }}
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch, resource]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-otel-collector
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-otel-collector
spec:
  replicas: {{ .Values.global.otelCollector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-otel-collector
    spec:
      serviceAccountName: otel-collector-serviceaccount
      containers:
        - name: otel-collector
          image: "{{ .Values.global.otelCollector.image.registry }}/{{ .Values.global.otelCollector.image.name }}:{{ .Values.global.otelCollector.image.tag }}"
          args: ["--config=/conf/otel-collector-config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 13133
              name: health-check
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: {{ .Values.global.otelCollector.configMapName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.otelCollector.serviceName }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: health-check
      port: 13133
      targetPort: health-check