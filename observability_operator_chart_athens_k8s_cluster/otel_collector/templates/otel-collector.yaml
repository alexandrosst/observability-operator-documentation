apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include \"otel-collector.fullname\" . }}
  labels:
    app.kubernetes.io/name: otel-collector
    helm.sh/chart: otel-collector
    app.kubernetes.io/instance: \"{{ .Release.Name }}\"
    app.kubernetes.io/managed-by: \"{{ .Release.Service }}\"

data:
  otel-agent-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    processors:
      batch: {}
      resource:
        attributes:
          - key: cluster
            value: {{ .Values.otelCollector.clusterName }}
            action: insert
    exporters:
      otlp:
        endpoint: {{ .Values.otelCollector.exporters.otlp.host }}:{{ .Values.otelCollector.exporters.otlp.port }}
        tls:
          insecure: {{ .Values.otelCollector.exporters.otlp.tls.insecure }}
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: {{ .Values.otelCollector.scrapeInterval }}
            evaluation_interval: {{ .Values.otelCollector.evaluationInterval }}
          scrape_configs:
            - job_name: kepler
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: kepler
                  action: keep
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
            - job_name: node-exporter
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: prometheus-node-exporter
                  action: keep
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [resource,batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include \"otel-collector.fullname\" . }}
  labels:
    {{- include \"otel-collector.labels\" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: \"{{ .Release.Name }}\"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: \"{{ .Release.Name }}\"
    spec:
      serviceAccountName: {{ include \"otel-collector.serviceAccountName\" . }}
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args: [\"--config=/conf/otel-agent-config.yaml\"]
          ports:
            - containerPort: 13133
              name: health-check
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: {{ include \"otel-collector.fullname\" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include \"otel-collector.fullname\" . }}
  labels:
    {{- include \"otel-collector.labels\" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: health-check
      port: 13133
      targetPort: health-check
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: \"{{ .Release.Name }}\"
