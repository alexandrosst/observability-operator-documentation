name: Helm validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      chart_path:
        description: Path to the root Helm chart directory
        required: false
        default: charts/observability-operator

jobs:
  validate:
    # Deduplication: skip push-triggered runs created by the bot
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve chart directory
        id: chartdir
        run: |
          set -eu
          CHART_DIR='${{ github.event.inputs.chart_path }}'
          if [ -z "$CHART_DIR" ]; then
            CHART_DIR='charts/observability-operator'
          fi

          if [ ! -f "$CHART_DIR/Chart.yaml" ]; then
            FOUND_CHART=$(find . -path '*/Chart.yaml' -not -path './.git/*' | head -n 1 || true)
            if [ -n "$FOUND_CHART" ]; then
              CHART_DIR=$(dirname "$FOUND_CHART")
            else
              echo "::error::No Chart.yaml found. Set workflow_dispatch input chart_path to the chart directory."
              exit 1
            fi
          fi

          echo "chart_dir=$CHART_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        run: |
          set -eux
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Add Helm repos
        working-directory: ${{ steps.chartdir.outputs.chart_dir }}
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add sustainable-computing-io https://sustainable-computing-io.github.io/kepler-helm-chart || true
          helm repo update

      - name: Update chart dependencies
        working-directory: ${{ steps.chartdir.outputs.chart_dir }}
        run: |
          helm dependency update .

      - name: Lint parent chart
        working-directory: ${{ steps.chartdir.outputs.chart_dir }}
        run: helm lint .

      - name: Template with example values
        working-directory: ${{ steps.chartdir.outputs.chart_dir }}
        run: |
          helm template collection-agent . -f "${GITHUB_WORKSPACE}/examples/production-values.yaml" | sed -n '1,2000p'

      - name: Validate dependency charts
        run: |
          set -eux
          pip3 install pyyaml
          python3 .github/scripts/show-deps.py --chart-dir '${{ steps.chartdir.outputs.chart_dir }}'


