name: Validate Observability Helm Chart

on:
  pull_request:
    paths:
      - "observability_operator_chart/**"
      - ".github/workflows/helm-validate.yml"
  push:
    branches:
      - main
    paths:
      - "observability_operator_chart/**"
      - ".github/workflows/helm-validate.yml"
  workflow_dispatch:

jobs:
  validate-helm-chart:
    name: Validate Helm chart
    runs-on: ubuntu-latest

    env:
      CHART_PATH: observability_operator_chart/observability_operator
      RELEASE_NAME: observability-operator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add required Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add kepler https://sustainable-computing-io.github.io/kepler-helm-chart
          helm repo add fluent https://fluent.github.io/helm-charts
          helm repo update

      - name: Update chart dependencies
        run: |
          helm dependency update "$CHART_PATH"

      - name: Lint chart
        run: |
          helm lint "$CHART_PATH"

      - name: Render chart
        run: |
          helm template "$RELEASE_NAME" "$CHART_PATH" \
            --namespace observability \
            --create-namespace \
            > rendered.yaml

      - name: Show rendered manifests
        run: |
          head -n 80 rendered.yaml

      - name: Validate rendered Kubernetes manifests
        uses: yannh/kubeconform-action@v0.6.7
        with:
          files: rendered.yaml
          strict: true
          summary: true
          ignore-missing-schemas: true

