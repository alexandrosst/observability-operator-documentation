name: 2. Validate Observability Helm Chart

on:
  workflow_run:
    workflows: ["1. Dynamic Clean Feature Branch Overwrite"]
    types:
      - completed

permissions:
  contents: read

jobs:
  validate-helm-chart:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      RELEASE_NAME: observability-operator

    steps:
      - name: Checkout feature branch at cleaned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Dynamically detect whichever chart folder the agent pushed
      - name: Detect chart folder
        id: detect
        run: |
          CHART_DIR=$(find . -maxdepth 1 -type d -name "observability_operator_chart*" | head -n 1)
          if [ -z "$CHART_DIR" ]; then
            echo "No observability_operator_chart* folder found. Skipping."
            exit 0
          fi
          echo "Detected chart directory: $CHART_DIR"
          echo "chart_dir=$CHART_DIR/observability_operator" >> $GITHUB_OUTPUT

      - uses: azure/setup-helm@v4

      - name: Add Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add sustainable-computing-io https://sustainable-computing-io.github.io/kepler-helm-chart
          helm repo add network-latency https://gitlab.com/api/v4/projects/44429468/packages/helm/stable
          helm repo add fluent https://fluent.github.io/helm-charts
          helm repo update

      - name: Update chart dependencies
        run: helm dependency update "${{ steps.detect.outputs.chart_dir }}"

      - name: Lint chart
        run: helm lint "${{ steps.detect.outputs.chart_dir }}" --strict

      - name: Render chart
        run: |
          helm template "$RELEASE_NAME" "${{ steps.detect.outputs.chart_dir }}" \
            --namespace observability \
            > rendered.yaml

      - name: Validate rendered Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7-alpine
        with:
          entrypoint: /kubeconform
          args: "-strict -summary rendered.yaml"
