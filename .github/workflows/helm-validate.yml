name: Agent Content Pipeline

on:
  push:
    branches:
      - feature/observability-operator-chart
    paths-ignore:
      - ".github/**"

permissions:
  contents: write

jobs:
  # ── JOB 1: CLEAN AND REWRITE HISTORY ───────────────────────────────────────
  dynamic-clean-and-overwrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      # We create an output to tell the next job what folder to validate
      changed_folder: ${{ steps.detect.outputs.folder }}
    steps:
      - name: Checkout repository (last 2 commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # 🌟 CRITICAL: Use a Personal Access Token (PAT) if you want the 
          # subsequent validation check to trigger after the force push!
          # token: ${{ secrets.YOUR_AGENT_PAT }} 

      - name: Detect and purge modified folder
        id: detect
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
          CURRENT_COMMIT=$(git rev-parse HEAD)

          CHANGED_FOLDER=$(git diff-tree --no-commit-id --name-only -r "$PREVIOUS_COMMIT" "$CURRENT_COMMIT" \
            | awk -F/ '{print $1}' | uniq | head -n 1)

          if [ -z "$CHANGED_FOLDER" ] || [ "$CHANGED_FOLDER" = "." ]; then
            echo "No specific top-level folder detected. Skipping purge."
            exit 0
          fi

          echo "Target folder: $CHANGED_FOLDER"
          echo "folder=$CHANGED_FOLDER" >> $GITHUB_OUTPUT

          # Backup
          mkdir -p /tmp/dynamic_backup
          cp -r "$CHANGED_FOLDER"/. /tmp/dynamic_backup/

          # Revert and Purge
          git checkout "$PREVIOUS_COMMIT" -- "$CHANGED_FOLDER"/
          git rm -rf "$CHANGED_FOLDER"/
          rm -rf "$CHANGED_FOLDER"/

          # Restore
          mkdir -p "$CHANGED_FOLDER"
          cp -r /tmp/dynamic_backup/. "$CHANGED_FOLDER"/

          # Amend and Force Push
          git add "$CHANGED_FOLDER"/
          if ! git diff --staged --quiet; then
            git commit --amend --no-edit
            git push origin HEAD:"${{ github.ref }}" --force
          else
            echo "Folder is already clean. No action needed."
          fi

  # ── JOB 2: VALIDATION (Only runs AFTER cleanup finishes) ───────────────────
  validate-chart:
    needs: dynamic-clean-and-overwrite # 🌟 THIS ENFORCES THE SEQUENCE!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fresh code
        uses: actions/checkout@v4

      # Paste your exact Helm lint / Kubeconform steps here...
      - name: Run Kubeconform
        run: |
          # You can even use the output from job 1 if needed:
          echo "Validating folder: ${{ needs.dynamic-clean-and-overwrite.outputs.changed_folder }}"
          # Your validation commands here...