name: Helm validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  validate:
    # Deduplication: skip push-triggered runs created by the bot
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          set -eux
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Add Helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add sustainable-computing-io https://sustainable-computing-io.github.io/kepler-helm-chart || true
          helm repo update

      - name: Update chart dependencies
        run: |
          helm dependency update .

      - name: Lint parent chart
        run: helm lint .

      - name: Template with example values
        run: |
          helm template collection-agent . -f examples/production-values.yaml | sed -n '1,2000p'

      - name: Validate dependency charts
        run: |
          set -eux
          pip3 install pyyaml
          python3 .github/scripts/show-deps.py


