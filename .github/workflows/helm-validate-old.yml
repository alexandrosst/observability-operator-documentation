name: Validate Observability Helm Chart

on:
  pull_request:
    branches:
      - main
    paths:
      - "observability_operator_chart*/**"
      - ".github/workflows/helm-validate.yml"

jobs:
  validate-helm-chart:
    runs-on: ubuntu-latest

    env:
      RELEASE_NAME: observability-operator

    steps:
      - uses: actions/checkout@v4

      # Dynamically detect the chart folder
      - name: Detect chart folder
        id: detect
        run: |
          CHART_DIR=$(find . -maxdepth 1 -type d -name "observability_operator_chart*" | head -n 1)
          echo "Detected chart directory: $CHART_DIR"
          echo "chart_dir=$CHART_DIR/observability_operator" >> $GITHUB_OUTPUT

      - uses: azure/setup-helm@v4

      - name: Add Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add kepler https://sustainable-computing-io.github.io/kepler-helm-chart
          helm repo add fluent https://fluent.github.io/helm-charts
          helm repo update

      - name: Update chart dependencies
        run: helm dependency update "${{ steps.detect.outputs.chart_dir }}"

      - name: Lint chart
        run: helm lint "${{ steps.detect.outputs.chart_dir }}"

      - name: Render chart
        run: |
          helm template "$RELEASE_NAME" "${{ steps.detect.outputs.chart_dir }}" \
            --namespace observability \
            > rendered.yaml

      - name: Validate rendered Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7-alpine
        with:
          entrypoint: /kubeconform
          args: "-strict -summary -ignore-missing-schemas rendered.yaml"